<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Visit Us | Lumina Roasters Ahmedabad</title>
    <meta name="description" content="Join us at The Roastery in Vastrapur, Ahmedabad. Reserve your table for slow mornings and intentional moments. Open daily.">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lumina-roasters.vercel.app/visit.html">
    <meta property="og:title" content="Visit Us | Lumina Roasters Ahmedabad">
    <meta property="og:description" content="Join us at The Roastery in Vastrapur, Ahmedabad. Reserve your table for slow mornings and intentional moments.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=1200&h=630&q=80">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Visit Us | Lumina Roasters Ahmedabad">
    <meta name="twitter:description" content="Join us at The Roastery in Vastrapur, Ahmedabad. Reserve your table for slow mornings and intentional moments.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=1200&h=630&q=80">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

    <script>
        if (localStorage.getItem('lumina-theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>

<body>

    <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>

    <nav>
        <div class="logo">
            <a href="index.html" class="interactive" style="text-decoration: none; color: inherit;">Lumina.</a>
        </div>

        <button class="mobile-menu-btn interactive" id="mobile-toggle" aria-label="Open Menu">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none"
                stroke-linecap="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="nav-links">

            <a href="index.html" class="interactive mobile-only-link" aria-label="Go to home page">Home</a>
            <a href="menu.html" class="interactive" aria-label="View our menu">Menu</a>
            <a href="index.html#process" class="interactive" aria-label="Learn about our process">Our Process</a>
            <a href="visit.html" class="interactive" aria-label="Visit our location">Visit Us</a>

            <div class="mobile-theme-row">
                <span class="mobile-theme-label">Theme</span>

                <button id="theme-toggle" class="theme-switch interactive" aria-label="Toggle Dark Mode">
                    <span class="switch-thumb"></span>
                    <span class="track-icon icon-sun">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y1="3"></line>
                            <line x1="12" y1="21" x2="12" y1="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y1="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y1="19.78"></line>
                            <line x1="1" y1="12" x2="3" y1="12"></line>
                            <line x1="21" y1="12" x2="23" y1="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y1="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="5.64" y1="19.78"></line>
                        </svg>
                    </span>
                    <span class="track-icon icon-moon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <span class="icon-stars" aria-hidden="true">
                            <span class="star-particle star-1"></span>
                            <span class="star-particle star-2"></span>
                            <span class="star-particle star-3"></span>
                        </span>
                    </span>
                </button>
            </div>
        </div>
    </nav>

    <header class="visit-hero">
        <h1>Join Us</h1>
        <p>Reserve a table for slow mornings and intentional moments.</p>
    </header>

    <main class="visit-layout">

        <aside class="visit-info">
            <h2>The Roastery</h2>
            <p>123 Bodakdev Road<br>Vastrapur, Ahmedabad 380015</p>

            <div class="hours-block">
                <h3>Hours</h3>
                <p>Mon – Fri : 7:00 AM – 6:00 PM</p>
                <p>Sat – Sun : 8:00 AM – 5:00 PM</p>
            </div>

            <div class="contact-block">
                <h3>Contact</h3>
                <p>hello@luminaroasters.in</p>
                <p>+91 98765 43210</p>
            </div>
        </aside>

        <section class="visit-form-wrapper">
            <form class="reservation-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" class="interactive form-control" placeholder="Maya Patel" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="interactive form-control" placeholder="maya@example.com"
                            required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" class="interactive form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="guests">Guests</label>
                        <select id="guests" class="interactive form-control">
                            <option value="1">1 Person</option>
                            <option value="2" selected>2 People</option>
                            <option value="3">3 People</option>
                            <option value="4">4+ People</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Special Requests (Optional)</label>
                    <textarea id="message" rows="3" class="interactive form-control"
                        placeholder="Celebrating an anniversary, requesting a window seat..."></textarea>
                </div>

                <button type="submit" class="interactive cta-button submit-btn">Confirm Reservation</button>
            </form>
        </section>

    </main>

    <script type="module" src="./script.js"></script>
</body>

</html>
